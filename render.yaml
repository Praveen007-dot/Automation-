services:
  - type: web
    name: hospital-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-ai-db
          property: connectionString
      - key: HOSPITAL_NAME
        value: ABC Hospital
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_SLOT_DURATION
        value: 30
      - key: VERSION
        value: 1.0.0
      - key: CORS_ORIGINS
        value: '*'

databases:
  - name: hospital-ai-db
    databaseName: hospital_ai
    user: hospital_user
    plan: free
